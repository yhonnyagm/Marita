<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marita - Hello Kitty Space</title>

    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- Stickers Flotantes Estilo Kawaii (Sin lazos) -->
    <div class="kawaii-floating-stickers" aria-hidden="true">
      <span class="sticker s-1"><i class="fa-solid fa-heart"></i></span>
      <span class="sticker s-2"><i class="fa-solid fa-ice-cream"></i></span>
      <span class="sticker s-3"><i class="fa-solid fa-sparkles"></i></span>
      <span class="sticker s-4"><i class="fa-solid fa-cloud"></i></span>
      <span class="sticker s-5"><i class="fa-solid fa-star"></i></span>
      <span class="sticker s-6"><i class="fa-solid fa-heart"></i></span>
      <span class="sticker s-7"><i class="fa-solid fa-sparkles"></i></span>
    </div>

    <main class="kitty-card">
      <!-- Portada de Fondo con curvatura tierna -->
      <div class="card-cover"></div>

      <!-- Contenido Principal -->
      <div class="card-content">
        <!-- Avatar y Estatus Rosa Kawaii -->
        <div class="avatar-wrapper">
          <img
            src="./kitty-avatar.jpg"
            alt="Foto de perfil"
            class="avatar-photo"
          />
          <span class="status-dot" title="Cute & Online"></span>
        </div>

        <!-- Identidad: Nombre, ID y País -->
        <div class="user-details">
          <h1 class="user-name">Marita <span>♡</span></h1>

          <div class="tags-container">
            <span class="id-tag">#1526613604</span>
            <span class="country-tag">
              <img src="./co.png" alt="Colombia" class="flag-icon" />
              <span>COL</span>
            </span>
          </div>

          <p class="status-bio">La arepa es colombiana</p>
        </div>

<!-- Mini Reproductor Spotify Kawaii -->
        <div class="kitty-player">
          <div class="song-info">
            <div class="equalizer-waves" id="equalizer">
              <span></span><span></span><span></span>
            </div>
            <div class="track-meta">
              <p class="song-title">Te Amo</p>
              <p class="song-artist">Chayanne</p>
            </div>
          </div>
          <button class="kitty-player-btn" id="playPauseBtn" aria-label="Reproducir / Pausar">
            <i class="fa-solid fa-play" id="playIcon"></i>
          </button>
        </div>
        
        <!-- Botón Único de Deymians -->
        <div class="links-wrapper">
          <a href="https://xat.me/Deymians" class="kitty-btn-primary" target="_blank" rel="noopener">
            <i class="fa-solid fa-heart beat-icon"></i>
            <span>Deymians</span>
          </a>
        </div>
      </div>

      <!-- Créditos / Watermark Kawaii -->
    </main>
<!-- Contenedor oculto del reproductor de YouTube -->
    <div id="youtube-audio-player" style="display: none;"></div>

    <!-- YouTube IFrame API & Script de Autoplay -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
      let player;
      let isPlaying = false;
      const playPauseBtn = document.getElementById('playPauseBtn');
      const playIcon = document.getElementById('playIcon');
      const equalizer = document.getElementById('equalizer');

      function onYouTubeIframeAPIReady() {
        player = new YT.Player('youtube-audio-player', {
          height: '0',
          width: '0',
          videoId: 'scOW3MY4N1Q',
          playerVars: {
            'autoplay': 1,
            'controls': 0,
            'loop': 1,
            'playlist': 'scOW3MY4N1Q'
          },
          events: {
            'onReady': onPlayerReady,
            'onStateChange': onPlayerStateChange
          }
        });
      }

      function onPlayerReady(event) {
        event.target.playVideo();
        
        // Desbloqueo suave si las directivas del navegador exigen interacción previa
        const unlockAudio = () => {
          if (player && typeof player.playVideo === 'function') {
            player.playVideo();
          }
          document.removeEventListener('click', unlockAudio);
          document.removeEventListener('touchstart', unlockAudio);
        };

        document.addEventListener('click', unlockAudio, { once: true });
        document.addEventListener('touchstart', unlockAudio, { once: true });
      }

      function onPlayerStateChange(event) {
        if (event.data === YT.PlayerState.PLAYING) {
          isPlaying = true;
          playIcon.className = 'fa-solid fa-pause';
          equalizer.classList.add('playing');
        } else {
          isPlaying = false;
          playIcon.className = 'fa-solid fa-play';
          equalizer.classList.remove('playing');
        }
      }

      playPauseBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!player) return;
        if (isPlaying) {
          player.pauseVideo();
        } else {
          player.playVideo();
        }
      });
    </script>
  </body>
</html>
